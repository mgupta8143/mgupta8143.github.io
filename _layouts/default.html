<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <a class="home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Reproductions</a>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer class="site">
    <span>{{ site.title }}</span>
    <span>Built with Jekyll on GitHub Pages</span>
  </footer>
</body>
</html>
