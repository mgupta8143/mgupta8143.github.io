<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != "/" %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" sizes="32x32">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@300;400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header>
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="current"{% endif %}>About</a>
    <a href="{{ '/experience/' | relative_url }}"{% if page.url contains "experience" %} class="current"{% endif %}>Experience</a>
    <a href="{{ '/reproductions/' | relative_url }}"{% if page.url contains "reproduction" %} class="current"{% endif %}>Reproductions</a>
    <a href="{{ '/publications/' | relative_url }}"{% if page.url contains "publication" %} class="current"{% endif %}>Publications</a>
  </nav>
</header>
<main>{{ content }}</main>
<footer>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</footer>
</body>
</html>
