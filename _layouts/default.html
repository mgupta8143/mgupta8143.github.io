<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != "/" %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="here"{% endif %}>Home</a>
    <a href="{{ '/reproductions/' | relative_url }}"{% if page.url contains "/reproductions" %} class="here"{% endif %}>Reproductions</a>
    <a href="https://github.com/{{ site.github_username }}">GitHub</a>
  </nav>
  {{ content }}
  <footer class="site">{{ site.title }}</footer>
</div>
</body>
</html>
