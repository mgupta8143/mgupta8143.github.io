<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != "/" %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header>
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="current"{% endif %}>About</a>
    <a href="{{ '/reproductions/' | relative_url }}"{% if page.url contains "reproduction" %} class="current"{% endif %}>Reproductions</a>
    <a href="{{ '/experience/' | relative_url }}"{% if page.url contains "experience" %} class="current"{% endif %}>Experience</a>
    <a href="https://github.com/{{ site.github_username }}">GitHub</a>
  </nav>
</header>
<main>{{ content }}</main>
<footer>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</footer>
</body>
</html>
